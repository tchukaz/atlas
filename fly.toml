# Johannesburg is Fly's nearest region to Port Harcourt. West African routing
# sometimes reaches London faster — worth measuring both before settling.
app = "atlas-house"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  # The two lines that matter. A machine that sleeps costs a guest 30 seconds
  # on a referral link and silently skips the nightly reminder and retention
  # jobs, which is the whole reason a scale-to-zero host was ruled out.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Only needed if R2 is not configured — without it, uploads live on the
# machine's ephemeral disk and vanish on the next deploy.
# [mounts]
#   source = "atlas_data"
#   destination = "/app/data"
